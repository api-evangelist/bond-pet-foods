      operationId: getWcStoreV1ProductsCollectionData
      summary: GET /wc/store/v1/products/collection-data
      tags:
      - wc/store/v1
      parameters:
      - name: context
        in: query
        required: false
        schema:
          type: string
          enum:
          - view
          - edit
          default: view
        description: Scope under which the request is made; determines fields present in response.
      - name: page
        in: query
        required: false
        schema:
          type: integer
          default: 1
          minimum: 1
        description: Current page of the collection.
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          default: 10
          minimum: 1
          maximum: 100
        description: Maximum number of items to be returned in result set.
      - name: search
        in: query
        required: false
        schema:
          type: string
        description: Limit results to those matching a string.
      - name: slug
        in: query
        required: false
        schema:
          type: string
        description: Limit result set to products with specific slug(s). Use commas to separate.
      - name: after
        in: query
        required: false
        schema:
          type: string
          format: date-time
        description: Limit response to resources created after a given ISO8601 compliant date.
      - name: before
        in: query
        required: false
        schema:
          type: string
          format: date-time
        description: Limit response to resources created before a given ISO8601 compliant date.
      - name: date_column
        in: query
        required: false
        schema:
          type: string
          default: date
          enum:
          - date
          - date_gmt
          - modified
          - modified_gmt
        description: When limiting response using after/before, which date column to compare against.
      - name: exclude
        in: query
        required: false
        schema:
          type: array
          items:
            type: integer
          default: []
        description: Ensure result set excludes specific IDs.
      - name: include
        in: query
        required: false
        schema:
          type: array
          items:
            type: integer
          default: []
        description: Limit result set to specific ids.
      - name: offset
        in: query
        required: false
        schema:
          type: integer
        description: Offset the result set by a specific number of items.
      - name: order
        in: query
        required: false
        schema:
          type: string
          default: desc
          enum:
          - asc
          - desc
        description: Order sort attribute ascending or descending.
      - name: orderby
        in: query
        required: false
        schema:
          type: string
          default: date
          enum:
          - date
          - modified
          - id
          - include
          - title
          - slug
          - price
          - popularity
          - rating
          - menu_order
          - comment_count
        description: Sort collection by object attribute.
      - name: parent
        in: query
        required: false
        schema:
          type: array
          items:
            type: integer
          default: []
        description: Limit result set to those of particular parent IDs.
      - name: parent_exclude
        in: query
        required: false
        schema:
          type: array
          items:
            type: integer
          default: []
        description: Limit result set to all items except those of a particular parent ID.
      - name: type
        in: query
        required: false
        schema:
          type: string
          enum:
          - simple
          - grouped
          - external
          - variable
          - variation
        description: Limit result set to products assigned a specific type.
      - name: sku
        in: query
        required: false
        schema:
          type: string
        description: Limit result set to products with specific SKU(s). Use commas to separate.
      - name: featured
        in: query
        required: false
        schema:
          type: boolean
        description: Limit result set to featured products.
      - name: category
        in: query
        required: false
        schema:
          type: string
        description: Limit result set to products assigned a set of category IDs or slugs, separated by commas.
      - name: category_operator
        in: query
        required: false
        schema:
          type: string
          enum:
          - in
          - not_in
          - and
          default: in
        description: Operator to compare product category terms.
      - name: brand
        in: query
        required: false
        schema:
          type: string
        description: Limit result set to products assigned a set of brand IDs or slugs, separated by commas.
      - name: brand_operator
        in: query
        required: false
        schema:
          type: string
          enum:
          - in
          - not_in
          - and
          default: in
        description: Operator to compare product brand terms.
      - name: tag
        in: query
        required: false
        schema:
          type: string
        description: Limit result set to products assigned a set of tag IDs or slugs, separated by commas.
      - name: tag_operator
        in: query
        required: false
        schema:
          type: string
          enum:
          - in
          - not_in
          - and
          default: in
        description: Operator to compare product tags.
      - name: on_sale
        in: query
        required: false
        schema:
          type: boolean
        description: Limit result set to products on sale.
      - name: min_price
        in: query
        required: false
        schema:
          type: string
        description: Limit result set to products based on a minimum price, provided using the smallest unit of the currency.
      - name: max_price
        in: query
        required: false
        schema:
          type: string
        description: Limit result set to products based on a maximum price, provided using the smallest unit of the currency.
      - name: stock_status
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - instock
            - outofstock
            - onbackorder
          default: []
        description: Limit result set to products with specified stock status.
      - name: attributes
        in: query
        required: false
        schema:
          type: array
          items:
            type: object
            properties:
              attribute:
                description: Attribute taxonomy name.
                type: string
              term_id:
                description: List of attribute term IDs.
                type: array
                items:
                  type: integer
              slug:
                description: List of attribute slug(s). If a term ID is provided, this will be ignored.
                type: array
                items:
                  type: string
              operator:
                description: Operator to compare product attribute terms.
                type: string
                enum:
                - in
                - not_in
                - and
          default: []
        description: Limit result set to products with selected global attributes.
      - name: attribute_relation
        in: query
        required: false
        schema:
          type: string
          enum:
          - in
          - and
          default: and
        description: The logical relationship between attributes when filtering across multiple at once.
      - name: catalog_visibility
        in: query
        required: false
        schema:
          type: string
          enum:
          - any
          - visible
          - catalog
          - search
          - hidden
        description: Determines if hidden or visible catalog products are shown.
      - name: rating
        in: query
        required: false
        schema:
          type: array
          items:
            type: integer
            enum:
            - 1
            - 2
            - 3
            - 4
            - 5
          default: []
        description: Limit result set to products with a certain average rating.
      - name: related
        in: query
        required: false
        schema:
          type: integer
        description: Limit result set to products related to a specific product ID.
      - name: calculate_price_range
        in: query
        required: false
        schema:
          type: boolean
          default: false
        description: If true, calculates the minimum and maximum product prices for the collection.
      - name: calculate_stock_status_counts
        in: query
        required: false
        schema:
          type: boolean
          default: false
        description: If true, calculates stock counts for products in the collection.
      - name: calculate_attribute_counts
        in: query
        required: false
        schema:
          type: array
          items:
            type: object
            properties:
              taxonomy:
                description: Taxonomy name.
                type: string
              query_type:
                description: "Filter condition\t being performed which may affect counts. Valid values include \"and\" and \"or\"."
                type: string
                enum:
                - and
                - or
          default: []
        description: If requested, calculates attribute term counts for products in the collection.
      - name: calculate_rating_counts
        in: query
        required: false
        schema:
          type: boolean
          default: false
        description: If true, calculates rating counts for products in the collection.
      - name: calculate_taxonomy_counts
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
            description: Taxonomy name.
          default: []
        description: If requested, calculates taxonomy term counts for products in the collection.
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductCollectionData'
        '400':
          description: Invalid request parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WpRestError'
        '401':
          description: Nonce or Cart-Token session required for this operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WpRestError'
        '404':
          description: No route or resource found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WpRestError'
