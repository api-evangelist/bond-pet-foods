cross_surface:
- entities: [Product, ContentProduct]
  relation: same_record_two_projections
  join: shared integer id in the WordPress wp_posts space
  detail: >-
    Neither projection is a superset. The Store API Product carries prices, stock, attributes,
    variations and add_to_cart; the wp/v2 product carries content, excerpt, featured_media and
    template. An agent that needs both commerce and editorial fields for one product must call
    both APIs and join on id.
traversal_notes:
- >-
  Anonymous callers can traverse the full commerce graph and the full public content graph, but
  the User entity terminates every author edge at a bare integer - /wp/v2/users returns 401.
- >-
  _embed on wp/v2 collection routes inlines author, featured_media and term edges in one request,
  which is the cheapest way to walk the content graph.
- >-
  There is no cross-entity search. /wp/v2/search covers posts, pages and terms only; Store API
  products are searched separately via the `search` parameter on /wc/store/v1/products.
