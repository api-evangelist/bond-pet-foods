aid: bond-pet-foods
name: Bond Pet Foods
description: >-
  Bond Pet Foods is a Boulder, Colorado food-biotechnology company that makes animal proteins for
  pet food by precision fermentation rather than by farming animals. Its process pairs a chicken
  DNA sequence with brewer's yeast and runs it through a roughly 48-hour controlled fermentation,
  after which the protein is harvested, dried and milled into a powder that pet food makers
  formulate into finished products. The company operates a 15,000 square-foot food lab in central
  Boulder, is led by founder and CEO Rich Kelleman, markets itself as an "Ally For All Animals",
  and has announced a $17.5M Series A, an investment from Symrise AG, and development partnerships
  with Hill's Pet Nutrition and Wilbur-Ellis Nutrition. Bond Pet Foods runs no developer program
  and publishes no API documentation, but its own site at www.bondpets.com runs on WordPress and
  WooCommerce and exposes a genuinely public, machine-readable API surface - a WordPress REST API
  discovery index advertising 970 routes across 57 namespaces, and an anonymously readable
  WooCommerce Store API covering the merchandise catalog, categories and cart.
