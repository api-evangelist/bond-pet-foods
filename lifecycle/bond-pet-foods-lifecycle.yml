summary: >-
  Bond Pet Foods publishes no API lifecycle commitments of any kind. There is no versioning
  policy, no deprecation policy, no Sunset or Deprecation header, no SLA, no status page and no
  changelog. Versioning is visible only as a path namespace, and superseded WooCommerce
  namespaces are still served with no notice of retirement.
versioning:
  style: path-namespace
  policy_published: false
  current:
  - namespace: wp/v2
    surface: Content API
    status: current
  - namespace: wc/store/v1
    surface: Store API
    status: current
  superseded_but_still_served:
  - namespace: wc/v1
    detail: >-
      Legacy WooCommerce REST namespace, superseded by wc/v3 upstream. Still registered and
      advertised in this host's route index. No sunset date is announced.
  - namespace: wc/v2
    detail: >-
      Legacy WooCommerce REST namespace, superseded by wc/v3 upstream. Still registered and
      advertised in this host's route index. No sunset date is announced.
  detail: >-
    A caller cannot tell from the route index which namespaces are current and which are legacy -
    all 57 are advertised identically. The status values above are derived from upstream
    WooCommerce release history, not from anything Bond Pet Foods publishes.
