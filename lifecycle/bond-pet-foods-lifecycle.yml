support:
  channel: https://www.bondpets.com/contact/
  detail: >-
    A general company contact form. There is no developer support channel, no community forum and
    no published support email for API consumers.
maturity_assessment:
  detail: >-
    This is an incidental API surface, not a managed one. It exists because WordPress and
    WooCommerce register REST routes by default, and it will change whenever the site's plugins
    are updated - the route index already reflects 57 namespaces contributed by Elementor,
    ElementsKit, RankMath, Jetpack, Klaviyo, Wordfence, FileBird and others. A consumer should
    treat every route as unversioned in practice and subject to change without notice.
